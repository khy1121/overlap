<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Overlap — 모두의 시간이 겹치는 순간</title>
    <meta name="description" content="일주일 중 각자 되는 시간을 칠하면, 모두가 되는 약속 시간을 찾아 제안해 드려요." />
    <meta property="og:title" content="Overlap" />
    <meta property="og:description" content="되는 시간을 칠하면, 모두 겹치는 시간을 찾아 드려요." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 앱 설치(PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Overlap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 라이트·다크를 직접 지원한다고 알려서, 삼성 인터넷 등이 색을 강제로 바꾸지 않게 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)" />
    <script>
      // 저장된 테마를 첫 페인트 전에 적용해 깜빡임을 막아요 (src/lib/theme.js와 같은 키).
      try {
        var t = localStorage.getItem('overlap-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#17171c' : '#f2f4f6' })
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preload" as="image" href="/brand/mascot.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
